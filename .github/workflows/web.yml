name: Web

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Core logic tests (Jest)
        run: npx jest

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web unit tests (Vitest)
        working-directory: web
        run: npm test

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests (also builds the site)
        working-directory: web
        run: npx playwright test

      - name: Upload test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload site build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/

  # Previews build independently of the test job so a broken change is still
  # viewable; test results show as a separate check on the PR.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        if: github.event.action != 'closed'
        working-directory: web
        run: npm ci && npm run build

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
